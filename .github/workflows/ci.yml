name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Coding standards
        run: composer lint

      - name: Unit tests
        run: composer test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript tests
        run: node --test tests/js/*.test.js

  plugin-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Check the files that ship, in a folder named after the plugin slug,
      # exactly as WordPress.org would see them.
      - name: Build the plugin
        run: bin/build-plugin.sh build

      - name: WordPress.org Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/povikvane-for-woocommerce
